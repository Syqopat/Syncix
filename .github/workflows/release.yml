name: Release

# Sürüm etiketi itildiğinde (v0.1.0 gibi) çalışır.
#
# Neden CI şart: core binary'si her platform için o platformda derlenmeli.
# Windows'ta macOS binary'si üretilemez (macOS SDK gerekir). Bu iş akışı üç
# binary'yi kendi makinelerinde derleyip tek bir .vsix içinde toplar; böylece
# kullanıcı hangi işletim sisteminde olursa olsun tek kurulumla çalışır.

# CI ile ayni sebep: kaynak agaci ProjectSyncix/ altinda, is akisi dosyasi
# depo kokunde olmak zorunda. Ayrintilar icin ci.yml'deki nota bak.

defaults:
  run:
    working-directory: ProjectSyncix

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  core:
    name: Core (${{ matrix.hedef }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            hedef: x86_64-pc-windows-msvc
            klasor: win32-x64
            dosya: syncix-core.exe
          # macOS ve Linux hedefleri BILEREK cikarildi. Kod tasinabilir
          # yazildi ama o platformlarda hic calistirilmadi; test edilmemis
          # binary yayinlamak, calisiyor iddiasinda bulunmak olur.
          # Roblox Studio zaten Linux'ta yok.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.hedef }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ProjectSyncix/core-engine
      - name: Derle
        working-directory: ProjectSyncix/core-engine
        run: cargo build --release --target ${{ matrix.hedef }}
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.klasor }}
          path: ProjectSyncix/core-engine/target/${{ matrix.hedef }}/release/${{ matrix.dosya }}

  paket:
    name: VSIX paketi
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Studio eklentisini derle
        run: rojo build studio-plugin/default.project.json -o vscode-extension/resources/SyncixPlugin.rbxm

      - name: Binary'leri indir
        uses: actions/download-artifact@v4
        with:
          path: ProjectSyncix/indirilen

      - name: Binary'leri yerleştir
        run: |
          for d in indirilen/core-*; do
            klasor="${d#indirilen/core-}"
            mkdir -p "vscode-extension/resources/bin/$klasor"
            cp "$d"/* "vscode-extension/resources/bin/$klasor/"
            chmod +x "vscode-extension/resources/bin/$klasor/"* || true
          done
          find vscode-extension/resources/bin -type f -exec ls -la {} \;

      - name: Paketle
        working-directory: ProjectSyncix/vscode-extension
        run: |
          npm ci || npm install
          npm run compile
          npx --yes @vscode/vsce package --out ../syncix.vsix

      - name: Sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          files: ProjectSyncix/syncix.vsix
          body: |
            Kurulum: syncix.vsix dosyasını indir, VS Code'da
            Extensions panelinde "..." > "Install from VSIX..." ile kur.

            Studio eklentisi ve core binary'si paketin içinde gelir,
            ayrıca bir şey indirmeye gerek yoktur.
