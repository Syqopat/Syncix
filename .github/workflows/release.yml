name: Release

# Runs when a version tag (such as v0.1.1) is pushed, or by hand.
#
# The core binary has to be compiled on the platform it is built for, so it is
# built on a Windows runner and then packed into the .vsix together with the
# Studio plugin. The release ships a Windows binary only: the code is written to
# be portable, but it has never been run on macOS or Linux, and shipping an
# untested binary would be a claim rather than a fact. Roblox Studio does not
# exist on Linux at all.

# Same reason as CI: the source tree lives under ProjectSyncix/, while workflow
# files have to be at the repository root. See the note in ci.yml.

defaults:
  run:
    working-directory: ProjectSyncix

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  core:
    name: Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            folder: win32-x64
            file: syncix-core.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ProjectSyncix/core-engine
      - name: Build
        working-directory: ProjectSyncix/core-engine
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.folder }}
          path: ProjectSyncix/core-engine/target/${{ matrix.target }}/release/${{ matrix.file }}

  package:
    name: VSIX package
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          path: ProjectSyncix

      - name: Build the Studio plugin
        run: rojo build studio-plugin/default.project.json -o vscode-extension/resources/SyncixPlugin.rbxm

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: ProjectSyncix/downloaded

      - name: Place the binaries
        run: |
          for d in downloaded/core-*; do
            folder="${d#downloaded/core-}"
            mkdir -p "vscode-extension/resources/bin/$folder"
            cp "$d"/* "vscode-extension/resources/bin/$folder/"
            chmod +x "vscode-extension/resources/bin/$folder/"* || true
          done
          find vscode-extension/resources/bin -type f -exec ls -la {} \;

      - name: Package
        working-directory: ProjectSyncix/vscode-extension
        run: |
          npm ci || npm install
          npm run compile
          npx --yes @vscode/vsce package --out ../syncix.vsix

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ProjectSyncix/syncix.vsix
          body: |
            Install: download syncix.vsix, then in VS Code open the Extensions
            panel and choose "..." > "Install from VSIX...".

            The Studio plugin and the core binary ship inside the package;
            there is nothing else to download.
