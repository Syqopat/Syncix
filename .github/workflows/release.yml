name: Release

# Runs on a version tag (v0.1.7), or by hand. It builds what the release page offers -
# the editor package, the Studio plugin, the Windows core - and writes the notes from
# the commit messages, so the page cannot disagree with the repository.
#
# The release ships a Windows binary only: the code is written to be portable, but it
# has never been run on macOS or Linux, and shipping an untested binary would be a claim
# rather than a fact. Roblox Studio does not exist on Linux at all.
#
# Same reason as ci.yml for the paths: the source tree lives under ProjectSyncix/, while
# workflow files have to be at the repository root.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ProjectSyncix

jobs:
  release:
    name: Build and publish the assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions match
        run: python tools/check-versions.py

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ProjectSyncix/packages/core-engine
      - name: Build the core
        working-directory: ProjectSyncix/packages/core-engine
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ProjectSyncix/packages/vscode-extension/package-lock.json

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          path: ProjectSyncix
      - name: Build the Studio plugin
        run: rojo build packages/studio-plugin/default.project.json -o packages/vscode-extension/resources/SyncixPlugin.rbxm

      # The asset is named after the version, without the tag's leading v: the tag
      # v0.1.7 produced syncix-v0.1.7.vsix beside the syncix-0.1.7.vsix already on the
      # page, which is one package under two names.
      - name: The version in this tag
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package the extension
        shell: bash
        run: |
          mkdir -p packages/vscode-extension/resources/bin/win32-x64
          cp packages/core-engine/target/release/syncix-core.exe packages/vscode-extension/resources/bin/win32-x64/
          cd packages/vscode-extension
          npm ci
          npm run compile
          npx --yes @vscode/vsce package --out ../../syncix-${{ steps.version.outputs.number }}.vsix

      # The body comes from CHANGELOG.md, which is the written record of the release;
      # entries there are drafted from the commit messages with git-cliff (cliff.toml)
      # and then edited. A tag whose version has no section fails here rather than
      # publishing an empty release page.
      - name: Notes from the changelog
        run: python tools/release-notes.py ${{ github.ref_name }} > RELEASE_NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: ProjectSyncix/RELEASE_NOTES.md
          # GitHub attaches the source archives itself; these are the built files a
          # user should not have to build.
          files: |
            ProjectSyncix/syncix-${{ github.ref_name }}.vsix
            ProjectSyncix/packages/vscode-extension/resources/SyncixPlugin.rbxm
            ProjectSyncix/packages/core-engine/target/release/syncix-core.exe
