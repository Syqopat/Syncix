name: CI

# One workflow for every component. Each job owns one language, so a failure says which
# part broke without reading the log.
#
# The source tree is not at the repository root but under ProjectSyncix/, and GitHub
# Actions only reads .github/workflows at the root. So this file lives here and every
# `run:` step works in that folder through `defaults` below. The path inputs of `uses:`
# steps are NOT affected by that default; each has to start with ProjectSyncix/.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ProjectSyncix

jobs:
  versions:
    name: Versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check-versions.py

  core:
    name: Core engine (Rust)
    # Windows: the product ships for Windows only, and the path-matching tests use
    # C:\-style absolute paths. On Ubuntu a backslash is not a separator, so those
    # tests failed for no meaningful reason (CI's very first run).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ProjectSyncix/packages/core-engine
      - name: Lints
        working-directory: ProjectSyncix/packages/core-engine
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
      - name: Build
        working-directory: ProjectSyncix/packages/core-engine
        run: cargo build --release
      # The integration tests start the real binary and bind ports, so they run one at
      # a time.
      - name: Tests
        working-directory: ProjectSyncix/packages/core-engine
        run: cargo test --release -- --test-threads=1

  extension:
    name: Editor extension (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ProjectSyncix/packages/vscode-extension/package-lock.json
      - name: Dependencies
        working-directory: ProjectSyncix/packages/vscode-extension
        run: npm ci
      - name: Type check
        working-directory: ProjectSyncix/packages/vscode-extension
        run: npm run typecheck
      - name: Tests
        working-directory: ProjectSyncix/packages/vscode-extension
        run: npm test
      - name: Build
        working-directory: ProjectSyncix/packages/vscode-extension
        run: npm run compile

  plugin:
    name: Studio plugin (Luau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          path: ProjectSyncix
      - name: Syntax
        # The plugin's own source only. The example place is sample content imported
        # from a real game: it holds a script that prints on load and file names in
        # another alphabet, neither of which says anything about Syncix.
        run: sh tools/luau-check.sh packages/studio-plugin/src
      - name: Used but never defined
        run: python tools/require-check.py
      - name: Tests
        run: python tools/luau-test.py

  layout:
    name: File layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No product file over 500 lines
        run: python tools/check-file-size.py
