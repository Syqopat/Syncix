# git-cliff: the changelog is written from the commit messages.
#
# It was written by hand before, which meant a change could ship without ever being
# mentioned. Conventional Commits (feat:, fix:, ...) make the messages the source, so
# the only way to leave something out of the changelog is to not commit it.

[changelog]
header = """
# Changelog

All notable changes to Syncix are recorded here.
Format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/);
versions follow [Semantic Versioning](https://semver.org/).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %}

  **Breaking:** {{ commit.breaking_description | trim }}\
{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^test", group = "Internal" },
    { message = "^docs", group = "Documentation" },
    { message = "^ci", group = "Internal" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Internal" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
