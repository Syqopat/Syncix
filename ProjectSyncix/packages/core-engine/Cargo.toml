[package]
name = "syncix-core"
version = "0.1.6"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.28", features = ["full", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Identifiers & Timestamps
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
thiserror = "1.0"
toml = "0.8"
rand = "0.8"

# Async Interfaces & Streams
async-trait = "0.1"
futures-util = "0.3"

# HTTP Server & WebSockets
#
# No CORS layer: the API answers 127.0.0.1 only and never sends an
# Access-Control-Allow-Origin header, so a browser will not hand a reply from this
# core to page scripts. Writes are gated by the project token instead.
axum = { version = "0.6", features = ["ws"] }

# API description, generated from the handlers
utoipa = { version = "3", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "3", features = ["axum"] }

# File System Watcher
notify = "6.0"
glob = "0.3.4"
roxmltree = "0.21.1"
