name: Release

# Runs on a version tag (v0.1.7). It builds what the release page offers - the editor
# package, the Windows core, the Studio plugin - and writes the notes from the commit
# messages, so the page cannot disagree with what is in the repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build the release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions match
        run: python tools/check-versions.py

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core-engine
      - name: Build the core
        working-directory: packages/core-engine
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/vscode-extension/package-lock.json

      - name: Build the Studio plugin
        run: |
          curl -sSL -o rojo.zip "https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip"
          unzip -q rojo.zip
          ./rojo build packages/studio-plugin/default.project.json --output SyncixPlugin.rbxm
        shell: bash

      - name: Package the extension
        working-directory: packages/vscode-extension
        shell: bash
        run: |
          mkdir -p resources/bin/win32-x64
          cp ../core-engine/target/release/syncix-core.exe resources/bin/win32-x64/
          cp ../../SyncixPlugin.rbxm resources/
          npm ci
          npx --yes @vscode/vsce package --out ../../syncix.vsix

      - name: Notes from the commit messages
        uses: orhun/git-cliff-action@v4
        id: notes
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          # The source archives GitHub attaches by default are kept; these are the
          # built ones a user does not want to build themselves.
          files: |
            syncix.vsix
            SyncixPlugin.rbxm
            packages/core-engine/target/release/syncix-core.exe
