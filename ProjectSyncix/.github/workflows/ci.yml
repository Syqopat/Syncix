name: CI

# One workflow for every component. Each job owns one language, so a failure says
# which part broke without reading the log.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check-versions.py

  core:
    name: Core engine (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/core-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core-engine
      - name: Formatting
        run: cargo fmt --check
        continue-on-error: true
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
      - name: Build
        run: cargo build --release
      # The integration tests start the real binary and bind ports, so they are not run
      # in parallel with each other.
      - name: Tests
        run: cargo test --release -- --test-threads=1

  extension:
    name: Editor extension (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run compile

  plugin:
    name: Studio plugin (Luau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Luau CLI
        run: |
          version=$(grep -oP 'luau-lang/luau@\K[0-9.]+' rokit.toml)
          curl -sSL -o luau.zip "https://github.com/luau-lang/luau/releases/download/${version}/luau-ubuntu.zip"
          unzip -q luau.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/luau"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Syntax
        run: sh tools/luau-check.sh $(find packages/studio-plugin/src -name "*.lua")
      - name: Used but never defined
        run: python tools/require-check.py
      - name: Tests
        run: python tools/luau-test.py

  layout:
    name: File layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No product file over 500 lines
        run: python tools/check-file-size.py
