<!--
  Marketplace and README logo (coloured version).

  The SAME mark as the sidebar icon; only colour and a background are added.
  The two arrows have different colours on purpose: the upper arrow goes from
  Studio to the editor, the lower one from the editor back to Studio. The mark
  says what the product does.

  The background is the same colour as the Studio panel's (RGB 30,33,40) —
  the extension, the panel and the logo share one palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#1E2128"/>
  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#FFFFFF">
      <path d="M30 52h44"/>
      <path d="M64 40l12 12-12 12"/>
    </g>
    <g stroke="#4C8DF5">
      <path d="M98 80H54"/>
      <path d="M64 68L52 80l12 12"/>
    </g>
  </g>
</svg>
